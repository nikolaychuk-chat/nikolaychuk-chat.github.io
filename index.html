$("#sc").innerHTML=`<h3>Профіль</h3><div class="sr"><div>Ваше ім'я<small>Співрозмовники звертатимуться до вас</small></div><input type="text" id="nm" value="${esc(c.name)}" placeholder="Ім'я"></div>
<h3>Вигляд</h3><div class="sr" style="display:block"><div class="op">${TH.map(x=>`<b class="${c.theme==x[0]?"a":""}" data-th="${x[0]}">${x[1]}</b>`).join("")}</div></div>
<div class="sr"><div>Акцентний колір</div><div class="op">${AC.map(a=>`<b class="sw ${c.acc==a?"a":""}" data-ac="${a}" style="background:${a}"></b>`).join("")}</div></div>
<div class="sr" style="display:block"><div style="margin-bottom:8px">Фон чату</div><div class="op">${WP.map(x=>`<b class="${c.wp==x[0]?"a":""}" data-wp="${x[0]}">${x[1]}</b>`).join("")}</div></div>
<div class="sr"><div>Розмір тексту<small id="fv">${c.fs}px</small></div><input type="range" min="12" max="20" value="${c.fs}" id="fs"></div>
<h3>Чат і сповіщення</h3>${TG.map(x=>`<div class="sr"><div>${x[1]} ${x[2]}${x[3]?`<small>${x[3]}</small>`:""}</div><div class="tg ${c[x[0]]?"on":""}" data-k="${x[0]}"><s></s></div></div>`).join("")}
<h3>Статистика</h3><div class="st"><div><b>${n.length}</b>Всього</div><div><b>${u}</b>Надіслано</div><div><b>${n.length-u}</b>Отримано</div><div><b>${n.filter(m=>m.t=="img").length}</b>Фото</div></div>
<h3>Дані</h3><button class="dg" onclick="if(cur&&confirm('Очистити поточний чат?')){S.m[cur.id]=[];save();ui();tab(0)}">🗑️ Очистити поточний чат</button><button class="dg" onclick="if(confirm('Видалити всі чати та налаштування?')){sessionStorage.removeItem('nm2');location.reload()}">💣 Скинути все</button>`;$("#sc").scrollTop=st0}
$("#sc").addEventListener("click",e=>{const t=e.target.closest("[data-th],[data-ac],[data-wp]");if(!t)return;const d=t.dataset;if(d.th)S.cfg.theme=d.th;if(d.ac)S.cfg.acc=d.ac;if(d.wp)S.cfg.wp=d.wp;save();apply();rSet()});
$("#sc").addEventListener("click",e=>{const g=e.target.closest(".tg");if(!g)return;const k=g.dataset.k;S.cfg[k]=S.cfg[k]?0:1;save();apply();ui();rSet()});
$("#sc").addEventListener("input",e=>{if(e.target.id=="nm")S.cfg.name=e.target.value.trim();if(e.target.id=="fs"){S.cfg.fs=+e.target.value;$("#fv").textContent=e.target.value+"px"}save();apply()});
document.addEventListener("keydown",e=>{if(e.key=="Escape"){$("#set").classList.remove("show");$("#lb").style.display="none";$("#menu").style.display="none";if(innerWidth>760)$("#info").classList.remove("open")}if((e.ctrlKey||e.metaKey)&&e.key=="k"){e.preventDefault();$("#q").focus()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&cur){S.un[cur.id]=0;save();ui()}});
const fx=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>").replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">$1</a>').replace(/\n/g,"<br>");
const bday=c=>c.bd&&c.bd[1]==new Date().getMonth()+1&&c.bd[2]==new Date().getDate();
const MEM=()=>`<div class="sec"></div>`+C.filter(z=>z.id&&!z.group).map(z=>`<div class="row" onclick="open(${z.id})"><img src="${z.img}" style="width:36px;height:36px;border-radius:50%;object-fit:cover"><div><b>${esc(z.n)}</b><span>${stat(z)}</span></div></div>`).join("");
const OP={1:["Ти тут? 😄","Гей, а ти граєш у Minecraft?","Нудно... давай поговоримо 😅"],2:["Як минув день? ❤️","Не забудь попити водички 🌸"],3:["Привіт. Як справи?","Бачив одну класну штуку — потім розкажу."],4:["Привітик! Я намалювала кошеня 🐱","А ти любиш кошенят? 🌸"]};
function goPin(){const m=$(`.m[data-id="${S.pm[cur.id]}"]`);if(m){m.scrollIntoView({behavior:"smooth",block:"center"});m.style.outline="2px solid var(--accent)";setTimeout(()=>m.style.outline="",1400)}}
function dn(){const e=$("#ms");e.scrollTo({top:e.scrollHeight,behavior:"smooth"})}
$("#ms").onscroll=()=>{const e=$("#ms");$("#dn").style.display=e.scrollHeight-e.scrollTop-e.clientHeight>260?"grid":"none"};
function fwdMenu(x,y,m){menu(x,y,C.filter(z=>z.id>0&&!z.group&&z.id!=cur.id).map(z=>({t:"→ "+z.n.split(" ")[0],f:()=>{msgs(z).push({id:uid(),r:"u",t:m.t,c:m.c,ts:Date.now(),st:"s",fw:1});save();ui();toast("Переслано: "+z.n.split(" ")[0]);ai(z)}})))}
document.addEventListener("dblclick",e=>{const el=e.target.closest(".m[data-id]");if(!el||!cur||cur.saved)return;const m=msgs(cur).find(x=>x.id==el.dataset.id);if(m){m.re=m.re||{};m.re["❤️"]?delete m.re["❤️"]:m.re["❤️"]=1;save();rMsgs()}});
async function gai(c){if(busy[c.id])return;busy[c.id]=1;
try{const M=C.filter(x=>x.id>0&&!x.group).sort(()=>Math.random()-.5).slice(0,Math.random()<.5?2:1);await sleep(900+Math.random()*1200);
msgs(c).forEach(m=>{if(m.r=="u"&&m.st!="f")m.st="r"});save();
for(const x of M){goOnline(x);typ[c.id]=1;ui();
const H=msgs(c).slice(-20).map(m=>m.r=="u"?{role:"user",content:(S.cfg.name||"Гість")+": "+(m.t=="img"?"[фото]":m.t=="aud"?"[голосове]":m.c)}:m.by==x.id?{role:"assistant",content:m.c}:{role:"user",content:((C.find(z=>z.id==m.by)||{n:"Хтось"}).n.split(" ")[0])+": "+m.c});
const r=await fetch(W,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:sys(x)+" Це спільний груповий чат, де пише вся родина. Відповідай лише від свого імені, без імені на початку.",messages:H})});
const d=await r.json(),t=(d.reply||"").trim();if(!t||t=="Немає відповіді")throw new Error(d.error?.message||d.error||"порожня відповідь");
await sleep(Math.min(2500,400+t.length*30));recv(c,t.split(/\n{2,}/)[0],x)}}
catch(e){const l=[...msgs(c)].reverse().find(m=>m.r=="u");if(l)l.st="f";save();toast("Не вдалося отримати відповідь: "+e.message)}
finally{typ[c.id]=0;busy[c.id]=0;ui();const L=last(c);if(L&&L.r=="u"&&L.st=="s")gai(c)}}
setInterval(()=>{if(!S.cfg.pro||document.hidden||Math.random()>.18)return;const a=C.filter(x=>OP[x.id]&&!busy[x.id]),c=a[Math.random()*a.length|0];if(!c)return;const l=last(c);if(l&&Date.now()-l.ts<18e4)return;goOnline(c);const o=OP[c.id];recv(c,o[Math.random()*o.length|0])},45e3);
setInterval(ui,3e4);apply();ui();
</script></body></html>
