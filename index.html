<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ніколайчук Месенджер</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #17212b; --sidebar-bg: #1c2733; --chat-bg: #0e1621;
  --accent: #5288c1; --accent2: #64b5f6; --text: #e8eaed;
  --text-dim: #8e99a4; --msg-out: #2b5278; --msg-in: #182533;
  --border: #232e3c; --input-bg: #232e3c;
}
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
.sidebar { width: 320px; min-width: 320px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.sidebar-header { padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); height: 56px; }
.sidebar-title { font-size: 19px; font-weight: 600; }
.search-box { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.search-input { width: 100%; background: var(--input-bg); border: none; border-radius: 20px; padding: 8px 16px; color: var(--text); font-size: 14px; font-family: inherit; outline: none; }
.search-input::placeholder { color: var(--text-dim); }
.contacts-list { flex: 1; overflow-y: auto; }
.contacts-list::-webkit-scrollbar { width: 4px; }
.contacts-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
.contact-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; transition: background 0.15s; }
.contact-item:hover { background: rgba(255,255,255,0.04); }
.contact-item.active { background: var(--msg-out); }
.avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.contact-info { flex: 1; min-width: 0; }
.contact-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact-preview { font-size: 13px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.contact-time { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); }
.chat-header { padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); background: var(--sidebar-bg); flex-shrink: 0; }
.chat-header-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.chat-header-name { font-size: 15px; font-weight: 600; }
.chat-header-status { font-size: 13px; color: var(--accent2); }
.messages-container { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 3px; }
.messages-container::-webkit-scrollbar { width: 4px; }
.messages-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
.date-divider { text-align: center; margin: 10px 0; }
.date-divider span { background: rgba(0,0,0,0.35); color: var(--text-dim); font-size: 12px; padding: 4px 12px; border-radius: 12px; }
.message { display: flex; animation: msgIn 0.18s ease; }
@keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.message.out { justify-content: flex-end; }
.message.in { justify-content: flex-start; }
.msg-bubble { max-width: 65%; padding: 8px 12px; border-radius: 18px; font-size: 14px; line-height: 1.55; word-break: break-word; }
.message.out .msg-bubble { background: var(--msg-out); border-bottom-right-radius: 4px; }
.message.in .msg-bubble { background: var(--msg-in); border-bottom-left-radius: 4px; }
.msg-time { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 4px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
.msg-status { color: var(--accent2); font-size: 12px; }
.typing-indicator { display: none; padding: 4px 0; }
.typing-indicator.show { display: flex; }
.typing-bubble { background: var(--msg-in); padding: 12px 16px; border-radius: 18px; border-bottom-left-radius: 4px; display: flex; gap: 4px; align-items: center; }
.typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); animation: bounce 1.2s infinite; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
.chat-input-area { padding: 12px 16px; background: var(--sidebar-bg); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
.message-input { flex:1; background: var(--input-bg); border: none; border-radius: 20px; padding: 10px 18px; color: var(--text); font-size: 14px; font-family: inherit; resize: none; outline: none; max-height: 120px; min-height: 42px; line-height: 1.5; }
.message-input::placeholder { color: var(--text-dim); }
.send-btn { width:42px; height:42px; border-radius:50%; background: var(--accent); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; transition: background 0.15s, transform 0.1s; flex-shrink:0; }
.send-btn:hover { background: var(--accent2); transform: scale(1.05); }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { opacity:0.45; cursor:not-allowed; transform:none; }
.welcome-screen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color: var(--text-dim); gap:14px; }
.welcome-title { font-size:20px; font-weight:600; color: var(--text); }
.welcome-sub { font-size:14px; }
@media (max-width: 640px) {
  .sidebar { width:100%; min-width:unset; }
  .sidebar.hidden { display:none; }
  .chat-area { display:none; }
  .chat-area.visible { display:flex; width:100%; }
  .back-btn { display:flex !important; }
}
.back-btn { display:none; cursor:pointer; color:var(--accent2); background:none; border:none; padding:4px; margin-right:2px; }
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5288c1" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span class="sidebar-title">Ніколайчуки</span>
  </div>
  <div class="search-box">
    <input class="search-input" type="text" placeholder="🔍 Пошук">
  </div>
  <div class="contacts-list" id="contactsList"></div>
</div>

<div class="chat-area" id="chatArea">
  <div class="welcome-screen" id="welcomeScreen">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <div class="welcome-title">Ніколайчук Месенджер</div>
    <div class="welcome-sub">Обери контакт зліва для розмови</div>
  </div>
  <div id="activeChatView" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
    <div class="chat-header">
      <button class="back-btn" onclick="goBack()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <img class="chat-header-avatar" id="headerAvatar" src="" alt="">
      <div style="flex:1">
        <div class="chat-header-name" id="headerName"></div>
        <div class="chat-header-status">онлайн</div>
      </div>
    </div>
    <div class="messages-container" id="messagesContainer"></div>
    <div class="chat-input-area">
      <textarea class="message-input" id="messageInput" placeholder="Написати повідомлення..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

const CONTACTS = [
  { id:1, name:"Станіслав Ніколайчук", photo:PHOTOS[1], personality:"Ти — Станіслав Ніколайчук, хлопчик 10-12 років. Енергійний, веселий, любиш ігри та футбол. Говориш коротко і жваво. Спілкуйся тільки українською.", preview:"Привіт! 👋", messages:[] },
  { id:2, name:"Ірина Ніколайчук", photo:PHOTOS[2], personality:"Ти — Ірина Ніколайчук, доросла жінка. Тепла, уважна, турботлива. Говориш по-доброму. Спілкуйся тільки українською.", preview:"Привіт! ❤️", messages:[] },
  { id:3, name:"Петро Ніколайчук", photo:PHOTOS[3], personality:"Ти — Петро Ніколайчук, дорослий чоловік. Спокійний, надійний, практичний. Говориш небагато але по суті. Спілкуйся тільки українською.", preview:"Привіт! 💪", messages:[] },
  { id:4, name:"Уляна Ніколайчук", photo:PHOTOS[4], personality:"Ти — Уляна Ніколайчук, дівчинка 6-8 років. Мила, безпосередня, говориш дуже просто. Спілкуйся тільки українською.", preview:"Привітик! 🌸", messages:[] }
];

const GREETINGS = {
  1:"О, привіт! Я якраз грав 😄",
  2:"Привіт! Як ти? ❤️",
  3:"Привіт. Що сталося?",
  4:"Привітик! Це я, Уляна! 🌸"
};

let active = null;

function getTime() {
  return new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
}

function renderContacts() {
  const list = document.getElementById('contactsList');
  list.innerHTML = '';
  CONTACTS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'contact-item' + (active && active.id===c.id ? ' active' : '');
    el.onclick = () => openChat(c.id);
    const last = c.messages[c.messages.length-1];
    const prev = last ? (last.role==='user' ? 'Ви: '+last.content : last.content) : c.preview;
    const short = prev.length>36 ? prev.slice(0,36)+'…' : prev;
    el.innerHTML = `<img class="avatar" src="${c.photo}" alt=""><div class="contact-info"><div class="contact-name">${c.name}</div><div class="contact-preview">${short}</div></div>${last?'<span class="contact-time">'+getTime()+'</span>':''}`;
    list.appendChild(el);
  });
}

function openChat(id) {
  active = CONTACTS.find(c=>c.id===id);
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('activeChatView').style.display = 'flex';
  document.getElementById('headerAvatar').src = active.photo;
  document.getElementById('headerName').textContent = active.name;
  renderContacts();
  renderMessages();
  document.getElementById('sidebar').classList.add('hidden');
  document.getElementById('chatArea').classList.add('visible');
  document.getElementById('messageInput').focus();
}

function renderMessages() {
  const c = document.getElementById('messagesContainer');
  c.innerHTML = '<div class="date-divider"><span>Сьогодні</span></div>';
  if (!active.messages.length) {
    addBubble({role:'assistant', content:GREETINGS[active.id]}, false);
  } else {
    active.messages.forEach(m => addBubble(m, false));
  }
  scrollDown();
}

function addBubble(msg, scroll=true) {
  const c = document.getElementById('messagesContainer');
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
  const div = document.createElement('div');
  div.className = 'message '+(msg.role==='user'?'out':'in');
  div.innerHTML = `<div class="msg-bubble">${msg.content}<div class="msg-time">${getTime()}${msg.role==='user'?'<span class="msg-status">✓✓</span>':''}</div></div>`;
  c.appendChild(div);
  if (scroll) scrollDown();
}

function showTyping() {
  const c = document.getElementById('messagesContainer');
  const div = document.createElement('div');
  div.className = 'typing-indicator show';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  c.appendChild(div);
  scrollDown();
}

function scrollDown() {
  const c = document.getElementById('messagesContainer');
  setTimeout(()=>c.scrollTop=c.scrollHeight, 50);
}

async function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text || !active) return;
  input.value = '';
  input.style.height = 'auto';

  const userMsg = {role:'user', content:text};
  active.messages.push(userMsg);
  addBubble(userMsg);
  renderContacts();
  showTyping();
  document.getElementById('sendBtn').disabled = true;

  const payload = JSON.stringify({
    system: active.personality,
    messages: active.messages.map(m => ({
      role: m.role === 'user' ? 'user' : 'assistant',
      content: m.content
    }))
  });

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: payload
    });

    const data = await res.json();
    const reply = data.reply || data.error || "Немає відповіді";

    const t = document.getElementById('typingIndicator');
    if (t) t.remove();
    const aMsg = {role:'assistant', content:reply};
    active.messages.push(aMsg);
    addBubble(aMsg);
    renderContacts();
  } catch(e) {
    const t = document.getElementById('typingIndicator');
    if (t) t.remove();
    addBubble({role:'assistant', content:'⚠️ '+e.message});
  }
  document.getElementById('sendBtn').disabled = false;
}

function goBack() {
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('chatArea').classList.remove('visible');
}

document.getElementById('messageInput').addEventListener('keydown', e => {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('messageInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight,120)+'px';
});

renderContacts();
</script>
